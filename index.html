<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEMILOS & MPK - SMAN 4 Babelan 2026</title>
<style>
:root{
  --blue:#0051ff;
}
*{box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{
  margin:0;
  min-height:100vh;
  /* Menggabungkan efek gelap transparan agar teks tetap terbaca, lalu meload fotomu */
  background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), url('bg_pemilos.jpeg') no-repeat center center fixed;
  background-size: cover;
  position:relative;
}
header{text-align:center;padding:28px;color:#fff}
header h1{margin:0;font-size:26px} header p{opacity:.8}
.container{max-width:1100px;margin:auto;padding:0 16px 50px}
.section-title{color:#fff;font-size:20px;font-weight:800;margin:30px 0 12px;background:rgba(255,255,255,.1);padding:10px 16px;border-radius:12px;border-left:4px solid var(--blue)}
.paslon-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:800px){.paslon-grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:18px;overflow:hidden;cursor:pointer;transition:.25s;border:3px solid transparent}
.card:hover{transform:translateY(-4px)} .card.active{border-color:var(--blue);box-shadow:0 0 0 4px #dbeafe}
.card img{width:100%;height:200px;object-fit:cover}
.card .info{padding:12px;text-align:center}.info h3{margin:0;font-size:16px}
.vote-card{background:#fff;border-radius:20px;padding:22px;margin-top:26px}
label{font-weight:700;margin:12px 0 6px;display:block}
select,textarea,input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:12px}
button{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:0;padding:15px;width:100%;border-radius:12px;font-weight:800;font-size:18px;margin-top:18px;cursor:pointer}
#status{text-align:center;margin-top:12px;font-weight:800}
.success{color:#16a34a}.error{color:#dc2626}
</style>
</head>
<body>
<header>
<h1>🗳️ PEMILOS SMAN 4 BABELAN 2026</h1>
<p>OSIS & MPK - ALTISIX | AVERIONS </p>
</header>
<div class="container">
<div id="loading" style="color:#fff;text-align:center;padding:40px">Loading data kelas... ⏳</div>
<div id="main" style="display:none">

<div class="section-title">🔵 PILIH KETUA OSIS - 3 PASLON</div>
<div class="paslon-grid" id="gridOSIS"></div>

<div class="section-title">🟢 PILIH KETUA MPK - 3 PASLON</div>
<div class="paslon-grid" id="gridMPK"></div>

<div class="vote-card">
<label>1. Kelas</label><select id="kelompok"></select>
<label>2. Nama Kamu</label><select id="nama"></select>
<label>3. Pilihan OSIS</label><input id="pilOSIS" readonly placeholder="Klik foto OSIS di atas">
<label>4. Pilihan MPK</label><input id="pilMPK" readonly placeholder="Klik foto MPK di atas">
<label>5. Harapan</label><textarea id="isi" rows="2"></textarea>
<button onclick="kirim()" id="btn">KIRIM VOTE OSIS & MPK 🚀</button>
<div id="status"></div>
</div>
</div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzQVmSmt8OtdfIUfoKJ6aWmoKBLXJTOU1jFsJR8ZaqMmulB9QhVGr0pe2KCLNRtPdS6/exec";

// ===== GANTI DISINI BOS - FOTO & NAMA BISA DIGANTI GANTI =====
const CONFIG = {
  background: "bg_pemilos.jpg",
  OSIS: [
    { id:"PASLON 1 OSIS", nama:"Chaesar Wira Pamungkas & Agreat Paulin Daniel", foto:"PASLON 01.jpeg", visi:"Mewujudkan OSIS sebagai organisasi yang mampu menampung ide, aspirasi, harapan siswa untuk kemajuan sekolah, dengan cara membuat program-program kerja unggulan yang adaptif dengan perubahan zaman serta relevan dengan minat siswa sehingga OSIS menjadi garda terdepan sekolah yang dapat di andalkan." },
    { id:"PASLON 2 OSIS", nama:"Aliana Anggela Komba & Rasyha Al-Farizzy A.", foto:"PASLON 02.jpeg", visi:"Mewujudkan OSIS yang aktif, kreatif, disiplin, bertanggung jawab, dan menjadi wadah aspirasi serta inspirasi bagi seluruh siswa" },
    { id:"PASLON 3 OSIS", nama:"Dani Akmal Alfarizi & Athifa Gita Savitri ", foto:"PASLON 03.jpeg", visi:"Mewujudkan OSIS sebagai wadah yang inklusif, inovatif, dan inspiratif dalam mengembangkan potensi siswa yang adaptif terhadap teknologi, unggul dalam prestasi, berkarakter, serta memiliki daya saing di era digital dengan menjunjung tinggi nilai kebersamaan dan gotong royong." }
  ],
  MPK: [
    { id:"PASLON 1 MPK", nama:"Paslon 1 MPK", foto:"PASLON 01 MPK.JPG", visi:"Visi MPK 1" },
    { id:"PASLON 2 MPK", nama:"Paslon 2 MPK", foto:"PASLON 02 MPK.JPG", visi:"Visi MPK 2" },
    { id:"PASLON 3 MPK", nama:"Paslon 3 MPK", foto:"PASLON O3 MPK.JPG", visi:"Visi MPK 3" }
  ]
};
// ============================================================

let DATA={};
function renderPaslon(){
  document.documentElement.style.setProperty('--bg',`url('${CONFIG.background}')`);
  const gO=document.getElementById('gridOSIS'), gM=document.getElementById('gridMPK');
  gO.innerHTML=''; gM.innerHTML='';
  CONFIG.OSIS.forEach(p=>{
    gO.innerHTML+=`<div class="card" id="c-${p.id}" onclick="pilih('OSIS','${p.id}')"><img src="${p.foto}"><div class="info"><h3>${p.id}</h3><small>${p.nama}</small></div></div>`;
  });
  CONFIG.MPK.forEach(p=>{
    gM.innerHTML+=`<div class="card" id="c-${p.id}" onclick="pilih('MPK','${p.id}')"><img src="${p.foto}"><div class="info"><h3>${p.id}</h3><small>${p.nama}</small></div></div>`;
  });
}
function pilih(tipe,id){
  if(tipe==='OSIS'){document.getElementById('pilOSIS').value=id; CONFIG.OSIS.forEach(p=>document.getElementById('c-'+p.id).classList.remove('active'))}
  else{document.getElementById('pilMPK').value=id; CONFIG.MPK.forEach(p=>document.getElementById('c-'+p.id).classList.remove('active'))}
  document.getElementById('c-'+id).classList.add('active');
}
async function load(){
  try{
    const r=await fetch(API); DATA=await r.json();
    const selK=document.getElementById('kelompok'); selK.innerHTML='<option value="">-- Pilih Kelas --</option>';
    Object.keys(DATA).sort().forEach(k=>selK.innerHTML+=`<option value="${k}">${k}</option>`);
    document.getElementById('loading').style.display='none';
    document.getElementById('main').style.display='block';
    selK.onchange=upd; renderPaslon(); upd();
  }catch(e){document.getElementById('loading').innerHTML='Gagal: '+e}
}
function upd(){const k=document.getElementById('kelompok').value;const sN=document.getElementById('nama');sN.innerHTML='<option value="">-- Pilih Nama --</option>';if(k&&DATA[k])DATA[k].forEach(n=>sN.innerHTML+=`<option value="${n}">${n}</option>`)}
async function kirim(){
  const nama=document.getElementById('nama').value, kelompok=document.getElementById('kelompok').value, pilOSIS=document.getElementById('pilOSIS').value, pilMPK=document.getElementById('pilMPK').value, isi=document.getElementById('isi').value;
  const status=document.getElementById('status'), btn=document.getElementById('btn');
  if(!kelompok||!nama||!pilOSIS||!pilMPK){status.innerHTML='<span class=error>Lengkapi kelas, nama, pilih OSIS & MPK!</span>';return}
  btn.disabled=true; btn.innerText='Mengirim...';
  try{
    // Kirim ke Sheet - pilihan gabung OSIS | MPK
    const pilihan = `OSIS:${pilOSIS} | MPK:${pilMPK}`;
    await fetch(API,{method:'POST',mode:'no-cors',body:new URLSearchParams({nama,kelompok,pilihan,isi})});
    status.innerHTML=`<span class=success>✅ ${nama} vote BERHASIL!<br>OSIS: ${pilOSIS}<br>MPK: ${pilMPK}</span>`;
    btn.innerText='TERKIRIM ✅';
  }catch(e){status.innerHTML='<span class=error>Error '+e+'</span>';btn.disabled=false}
}
load();
</script>
</body>
</html>
